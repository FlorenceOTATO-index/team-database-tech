<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FARS 2024 · U.S. Fatal Crash Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="topbar">
  <div class="topbar-row">
    <a class="brand" href="#overview" aria-label="FARS 2024 home">
      <svg aria-hidden="true" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="#e9a23b" stroke-width="2"/><circle cx="16" cy="16" r="5" fill="#e9a23b"/><circle cx="16" cy="16" r="9" fill="none" stroke="#e9a23b" stroke-opacity=".35" stroke-width="1"/></svg>
      <span><strong>FARS 2024</strong><small>U.S. fatal crash explorer</small></span>
    </a>
    <nav class="tabs" aria-label="Dashboard sections">
      <a href="#overview" data-page="overview">Overview</a>
      <a href="#behavior" data-page="behavior">Behavior</a>
      <a href="#survival" data-page="survival">Survival</a>
      <a href="#portfolio" data-page="portfolio">Query Portfolio</a>
      <a href="#database" data-page="database">Database</a>
    </nav>
    <div class="conn" id="conn" aria-live="polite"><span class="conn-dot"></span><span id="conn-text">Connecting to MySQL…</span></div>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Filters">
    <label class="field">State
      <select id="f-state"><option value="">All states</option></select>
    </label>
    <div class="field">
      <span id="area-label">Area</span>
      <div class="seg" id="f-area" role="group" aria-labelledby="area-label">
        <button type="button" data-v="" aria-pressed="true">All</button>
        <button type="button" data-v="1" aria-pressed="false">Rural</button>
        <button type="button" data-v="2" aria-pressed="false">Urban</button>
      </div>
    </div>
    <label class="field">From
      <select id="f-m1"></select>
    </label>
    <label class="field">To
      <select id="f-m2"></select>
    </label>
    <button type="button" class="btn-ghost" id="f-reset">Reset</button>
    <p class="filter-summary" id="filter-summary" aria-live="polite"></p>
  </div>
</header>
<main id="main" tabindex="-1"></main>
<footer class="site-foot">
  <span>Data: NHTSA Fatality Analysis Reporting System (FARS), 2024 · every chart is a live MySQL query</span>
  <span>DATA 201 · Group 1 · Jue Wang · Ryan Williams · Saida Mahmood · Tzu Yang</span>
</footer>
<div id="tip" class="tip" role="tooltip" hidden></div>
<dialog id="sql-dialog" class="sql-dialog"></dialog>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
