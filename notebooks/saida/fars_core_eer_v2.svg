<text x='60' y='1130' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#1F3864' text-anchor='start'>Legend</text>
<text x='60' y='1162' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>double rectangle = weak entity</text>
<text x='60' y='1190' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>double diamond = identifying</text>
<text x='60' y='1218' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>dashed underline = partial key</text>
<text x='60' y='1246' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>double line = total</text>
<text x='60' y='1274' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>circle d = disjoint subclasses</text>
<text x='60' y='1302' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>⊂ = subset / IS-A</text>
<text x='1300' y='1855' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='20' font-weight='400' fill='#555555' text-anchor='middle'>OCCUPIES links OCCUPANT to the CRASH_UNIT supertype, so it covers occupants of both moving and parked units. It is not enforced as a foreign key:</text>
<text x='1300' y='1883' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='20' font-weight='400' fill='#555555' text-anchor='middle'>VEH_NO = 0 encodes “no unit” rather than NULL, so the 9,020 non-motorist rows would violate it.</text>
