<text x='60' y='620' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='24' font-weight='700' fill='#1F3864' text-anchor='start'>Legend</text>
<text x='60' y='652' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>single oval = simple attribute</text>
<text x='60' y='680' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>oval on an oval = composite</text>
<text x='60' y='708' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>double oval = multivalued</text>
<text x='60' y='736' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>solid underline = key</text>
<text x='60' y='764' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>dashed underline = partial key</text>
<text x='60' y='792' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>double rectangle = weak entity</text>
<text x='60' y='820' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>double diamond = identifying</text>
<text x='60' y='848' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='19' font-weight='400' fill='#333' text-anchor='start'>double line = total participation</text>
<text x='1250' y='1610' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='20' font-weight='400' fill='#C00000' text-anchor='middle'>Plain ER limits: VEH_EVENT is genuinely unit-level, but VIOLATION applies only to moving vehicles — plain ER cannot say so;</text>
<text x='1250' y='1640' font-family='Segoe UI, Helvetica, Arial, sans-serif' font-size='20' font-weight='400' fill='#C00000' text-anchor='middle'>and OCCUPIES is partial on BOTH sides — 9,020 persons occupy no unit. The EER model resolves both.</text>
